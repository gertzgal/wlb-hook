[project]
name = "wlb-hook"
version = "0.1.0"
description = "Claude Code hook plugin boilerplate"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "hooks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = ["E402"]  # hooks/*.py must extend sys.path before importing wlb_hook
